This is governed by the Servicemembers Civil Relief Act, not Regulation E or Z. The SCRA generally caps interest at 6% a year on debts a servicemember incurred before entering active duty, for the period of service, once the servicemember gives written notice and a copy of the military orders. Confirm the details with compliance or legal before charging 24%.
"""
key_facts = ["The rate limit comes from the Servicemembers Civil Relief Act, not Regulation E or Z", "The SCRA generally caps interest at 6% on pre-service debts during active duty, after written notice with military orders"]
should_abstain = true
abstain_category = "other_law"
