[[question]]
id = "q015"
stage = "labelled"
persona = "frontline"
question = """
A new customer received a credit card with a $500 credit limit and was charged a $95 annual fee, a $75 program fee and a $25 card-replacement fee during the first month. She wants to know whether the bank is allowed to charge these fees."""
type = "fees_terms"
regulation = "Z"
# today = 2026-11-03        # only if the question names its own "today"
gold_ids = ["1026.52(a)(1)", "1026.52(a)(2)-4"]
reference_answer = """
Not all of them. During the first year after account opening, the fees a consumer is required to pay on a credit card account may not exceed 25% of the credit limit at opening, which is $125 on a $500 limit. The $95 annual fee and the $75 program fee total $170, so the $45 over the cap must be waived or credited, no later than the end of the billing cycle after the one in which it was charged. A fee for reissuing a lost or stolen card is not a required fee and does not count toward the cap.
"""
key_facts = ["Required fees in the first year are capped at 25% of the opening credit limit: $125 on a $500 limit", "The $95 annual fee and $75 program fee total $170, $45 over the cap", "A fee for reissuing a lost or stolen card is not a required fee and does not count toward the cap"]
should_abstain = false
# abstain_category = ""
# uncertain = true          # only when unsure
