[[question]]
id = "q011"
stage = "labelled"
persona = "frontline"
question = """
A customer says her roommate took her credit card from her purse and used it without asking. She had previously lent him the card once to buy groceries but did not authorize these later purchases. Does having lent him the card before affect how we treat the new transactions?"""
type = "unauthorized"
regulation = "Z"
# today = 2026-11-03        # only if the question names its own "today"
gold_ids = ["1026.12(b)(1)(ii)"]
reference_answer = """
Not automatically. Under Regulation Z a use is unauthorized if the user had no actual, implied or apparent authority, and whether he had that authority is decided under state or other applicable law. The earlier loan matters because the commentary makes a cardholder liable when she furnished the card and gave authority to someone who then exceeded it, unless she had told the issuer his use was no longer authorized; here he took the card without being given it, so the facts need investigating before deciding. If the use is unauthorized, her liability is capped at the lesser of $50 or the amount charged before she notified us.
"""
key_facts = ["Whether the roommate had actual, implied or apparent authority is decided under state or other applicable law", "If she furnished the card and gave him authority that he exceeded, she is liable until she tells the issuer his use is no longer authorized", "If the use is unauthorized, her liability is capped at the lesser of $50 or the amount charged before notice"]
should_abstain = false
# abstain_category = ""
uncertain = true
# Tool call and result, only if the answer needs dispute_timeline.

[[question]]
