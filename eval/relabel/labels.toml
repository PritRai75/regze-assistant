[[question]]
id = "q021"
stage = "labelled"
persona = "compliance"
question = """
Our bank is developing a store-branded gift card that can only be used at the issuing store and its affiliated locations. The proposed terms include a monthly maintenance fee beginning six months after purchase and an expiration date three years after purchase. Are these proposed terms permitted?"""
type = "fees_terms"
regulation = "E"
# today = 2026-11-03        # only if the question names its own "today"
gold_ids = ["1005.20(d)", "1005.20(e)(1)", "1005.20(e)(2)"]
reference_answer = """
Neither term is permitted as proposed. A monthly maintenance fee is a service fee, and on a store gift card a dormancy, inactivity or service fee may be charged only after 12 months with no activity on the card, no more than once a month, and only if it is disclosed on the card, so a fee starting six months after purchase is not allowed. A card may carry an expiration date only if consumers have a reasonable opportunity to buy one with at least five years left before it expires, and the funds may not expire earlier than five years after they were last loaded, so a three-year expiration is not allowed either.
"""
key_facts = ["Dormancy, inactivity or service fees are allowed only after 12 months with no activity, at most one a month, and only if disclosed on the card", "The card must have at least five years left before its expiration date when sold", "The funds may not expire earlier than five years after they were last loaded"]
should_abstain = false
# abstain_category = ""
# uncertain = true          # only when unsure
# Tool call and result, only if the answer needs dispute_timeline.

[[question]]
id = "q022"
stage = "labelled"
persona = "compliance"
question = """
Our bank is developing a prepaid card that would allow customers to spend more than their available prepaid balance through a linked credit feature. The credit feature would cover the negative balance, and customers would repay the amount later. How is this product classified, and what requirements apply to the linked credit feature?"""
type = "cross_reg"
regulation = "both"
# today = 2026-11-03        # only if the question names its own "today"
gold_ids = ["1026.61(a)(1)", "1026.61(b)", "1026.61(c)"]
reference_answer = """
A prepaid card that can be used to access credit from a feature offered by the bank is a hybrid prepaid-credit card, which is a credit card under Regulation Z, and the linked credit feature is a covered separate credit feature subject to Regulation Z's credit card rules; the prepaid account itself remains a Regulation E prepaid account. The credit may not be structured as a negative balance on the prepaid account: it must be a separate credit account or a separate credit subaccount, drawn on when a transaction is authorized or settled so that the prepaid balance never goes negative. The bank also may not open the credit feature, solicit it or provide an application for it until 30 days after the prepaid account has been registered.
"""
key_facts = ["The card is a hybrid prepaid-credit card, which is a credit card under Regulation Z", "The credit must be a separate credit account or subaccount, not a negative balance on the prepaid account", "The credit feature may not be opened, solicited or applied for until 30 days after the prepaid account is registered"]
should_abstain = false
# abstain_category = ""
# uncertain = true          # only when unsure
# Tool call and result, only if the answer needs dispute_timeline.

