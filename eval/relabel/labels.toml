stage = "labelled"
persona = "frontline"
question = """
A customer says a hotel charged her credit card $480 even though the agreed room rate was $280. The $480 charge appears on her statement sent on 15 October 2026, and her written complaint reached our bank by mail on 2 November 2026. What deadlines apply to handling this billing complaint?"""
type = "deadline"
regulation = "Z"
# today = 2026-11-03        # only if the question names its own "today"
gold_ids = ["1026.13(b)(1)", "1026.13(c)(1)", "1026.13(c)(2)"]
reference_answer = """
Her letter is a billing error notice received within 60 days after the 15 October 2026 statement was sent, so it is timely. The bank must send her a written acknowledgment within 30 days of receiving it, by 2 December 2026, unless it resolves the dispute sooner. It must resolve the dispute within two complete billing cycles and in no event later than 90 days after receipt, so by 31 January 2027 at the latest.
"""
key_facts = ["Written acknowledgment is due within 30 days of receipt: by 2 December 2026", "Resolution is due within two complete billing cycles, no later than 90 days: by 31 January 2027 at the latest", "The notice is timely because it was received within 60 days after the 15 October 2026 statement"]
should_abstain = false
