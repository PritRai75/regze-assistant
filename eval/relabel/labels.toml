[[question]]
id = "q019"
stage = "labelled"
persona = "frontline"
question = """
A checking-account customer wants us to stop her insurance company's automatic monthly ACH debit from her account. The next payment is scheduled for 12 November 2026, and she is calling us today, 4 November 2026. What notice period applies to her stop-payment request?"""
type = "reg_e_account"
regulation = "E"
today = 2026-11-04
gold_ids = ["1005.10(c)(1)", "1005.10(c)(2)"]
reference_answer = """
Under Regulation E she may stop a preauthorized electronic transfer from her account by notifying the bank orally or in writing at least three business days before the scheduled transfer date. Her call on 4 November 2026 for a debit scheduled on 12 November 2026 meets that notice period, so the bank must honor the stop-payment order. If the bank requires written confirmation, it must tell her so during the call and give her the address, and the oral order stops being binding after 14 days if she does not confirm in writing.
"""
key_facts = ["She must notify the bank at least three business days before the scheduled transfer date", "Notice may be given orally or in writing", "Her call on 4 November 2026 is in time for the 12 November 2026 debit"]
should_abstain = false
# abstain_category = ""
# uncertain = true          # only when unsure
