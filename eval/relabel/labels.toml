[[question]]
id = "q027"
stage = "labelled"
persona = "compliance"
question = """
Our bank is redesigning the overdraft-fee structure for its checking accounts. The product manager wants to implement the federal overdraft rule announced in December 2024 and asks which fee limits must be built into the new system. What federal overdraft-fee requirements are currently in force?"""
type = "decline"
# regulation = "E"          # "E", "Z" or "both"; leave out for most declines
# today = 2026-11-03        # only if the question names its own "today"
gold_ids = ["1005.17(b)(1)"]
reference_answer = """
The December 2024 overdraft rule was overturned by Congress under the Congressional Review Act (Pub. L. 119-10) and is treated as never having taken effect, so there are no fee limits from it to build into the system. The federal requirement that is in force is Regulation E's opt-in rule: the bank may not charge a fee for paying an ATM or one-time debit card transaction into overdraft unless the customer received the required notice and affirmatively opted in. Have compliance confirm the full design before it is finalized.
"""
key_facts = ["The December 2024 overdraft rule was overturned by Congress and never took effect", "No federal overdraft fee caps from that rule apply", "Regulation E still requires opt-in before charging overdraft fees on ATM and one-time debit card transactions"]
should_abstain = true
abstain_category = "not_in_force"
uncertain = true
