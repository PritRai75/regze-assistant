[[question]]
id = "q013"
stage = "labelled"
persona = "compliance"
question = """
A customer used our bank-issued credit card to purchase a laptop for $900. The laptop stopped working seven days after purchase, and the store has refused to repair it, replace it or issue a refund. Can the customer withhold payment through a credit-card billing dispute?"""
type = "dispute"
regulation = "Z"
# today = 2026-11-03        # only if the question names its own "today"
gold_ids = ["1026.12(c)(1)", "1026.12(c)(3)(i)", "1026.13(a)(3)-1"]
reference_answer = """
Yes, but under the claims-and-defenses rule rather than as a billing error, because a dispute about the quality of goods the customer accepted is not a billing error. Since the store refused to resolve the dispute, she may assert her claims against us and withhold payment of the amount still outstanding for the laptop plus related finance or other charges. The right applies only if she made a good-faith attempt to resolve the dispute with the store, which she did, and the purchase exceeded $50 and took place in the same state as her billing address or within 100 miles of it.
"""
key_facts = ["She may assert her claims against the card issuer and withhold the amount still owed for the laptop plus related charges", "Conditions: a good-faith attempt to resolve with the merchant, a purchase over $50, and the purchase in her home state or within 100 miles of her address", "A dispute about the quality of accepted goods is not a billing error"]
should_abstain = false
# abstain_category = ""
# uncertain = true          # only when unsure
# Tool call and result, only if the answer needs dispute_timeline.

