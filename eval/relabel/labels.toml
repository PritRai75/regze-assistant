gold_ids = ["1005.11(c)(2)(i)", "1005.11(c)(3)(i)", "1005.11(c)(3)(ii)"]
reference_answer = """
The duplicate posting is an error under Regulation E, and because the purchase was made within 30 days after the first deposit to a new account, the new-account time limits apply. The bank must determine whether an error occurred, or provisionally credit the $120, within 20 business days of the 28 October 2026 notice, which is by 27 November 2026. If it provisionally credits, it may take up to 90 days to complete the investigation, until 26 January 2027; the 90-day period would also apply because this was a point-of-sale debit card purchase initiated outside the United States.
"""
key_facts = ["Determine the error or provisionally credit within 20 business days under the new-account rule: by 27 November 2026", "The investigation may take up to 90 days from the notice: until 26 January 2027"]
