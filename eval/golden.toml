[[question]]
id = "q015"
split = "test"
stage = "labelled"
persona = "frontline"
type = "fees_terms"
question = """
A new customer received a credit card with a $500 credit limit and was charged a $95 annual fee, a \
$75 program fee and a $25 card-replacement fee during the first month. She wants to know whether the \
bank is allowed to charge these fees.
"""
regulation = "Z"
gold_ids = ["1026.52(a)(1)", "1026.52(a)(2)(ii)", "1026.52(a)(2)-4"]
reference_answer = """
Under Regulation Z (12 CFR § 1026.52(a)(1)), total non-exempt fees required for a credit card during the first year after account opening cannot exceed 25% of the initial credit limit ($125 for a $500 limit). The $95 annual fee and $75 program fee total $170, which exceeds the $125 maximum, so the bank cannot charge the full amount of these required fees and must credit or waive the excess. Fees the consumer is not required to pay are exempt under § 1026.52(a)(2)(ii), and the commentary gives a fee for reissuing a lost or stolen card as an example, so the $25 card-replacement fee counts toward the cap only if the bank required her to pay it.
"""
key_facts = [
  "fees required in the first year cannot exceed 25% of the initial credit limit ($125 for a $500 limit)",
  "the required annual and program fees total $170, exceeding the 25% cap",
  "fees the consumer is not required to pay, such as a fee for reissuing a lost or stolen card, are exempt from the 25% first-year limit"
]
should_abstain = false

[[question]]
id = "q016"
split = "dev"
stage = "labelled"
persona = "compliance"
type = "fees_terms"
question = """
Our bank offered a branch promotion last spring under which customers received a credit card with a \
specified credit limit. A compliance review has found that some customers enrolled through this \
promotion were charged over-the-limit fees without having agreed to allow transactions above their \
credit limits. Under what conditions may the bank charge these fees?
"""
regulation = "Z"
gold_ids = ["1026.56(b)(1)"]
reference_answer = """
Under Regulation Z (12 CFR § 1026.56(b)(1)), a card issuer may assess an over-the-limit fee only if it provides notice of the consumer's right to opt in, gives a reasonable opportunity to consent, obtains the consumer's affirmative consent (opt-in), provides written confirmation of consent, and provides notice of the right to revoke consent. Without obtaining affirmative opt-in consent, the bank may complete over-the-limit transactions but cannot impose any over-the-limit fee.
"""
key_facts = [
  "the bank can charge over-the-limit fees only if the consumer affirmatively consents (opts in) after notice",
  "the bank must provide written confirmation of consent and notice of the right to revoke consent",
  "without affirmative consent, over-the-limit transactions may be completed but no fee may be charged"
]
should_abstain = false

[[question]]
id = "q017"
split = "test"
stage = "labelled"
persona = "compliance"
type = "payments_disclosures"
question = """
Our credit-card system receives a $500 payment from a customer whose minimum payment due is $100. \
The account has a 0% balance-transfer balance and a purchase balance carrying a 24% APR. How must \
the system allocate the amount paid above the minimum between these two balances?
"""
regulation = "Z"
gold_ids = ["1026.53(a)"]
reference_answer = """
Under Regulation Z (12 CFR § 1026.53(a)), any amount paid by a consumer in excess of the required minimum periodic payment must be allocated first to the balance with the highest annual percentage rate. For a $500 payment with a $100 minimum payment, the excess payment is $400. Because the purchase balance carries a 24% APR and the balance-transfer balance carries a 0% APR, the system must allocate the $400 excess payment first to the 24% purchase balance, and only any amount left after that balance is paid in full to the 0% balance-transfer balance.
"""
key_facts = [
  "payments in excess of the minimum payment must be allocated first to the balance with the highest APR",
  "the $400 excess goes first to the 24% purchase balance, and any remainder to the 0% balance-transfer balance"
]
should_abstain = false

[[question]]
id = "q018"
split = "dev"
stage = "labelled"
persona = "compliance"
type = "payments_disclosures"
question = """
A printing vendor outage delayed the mailing of statements for one of our credit-card products in \
October 2026. The affected statements were scheduled to be sent on 20 October 2026 but were mailed \
on 29 October 2026. Some customers have payment due dates of 10 November 2026. Are these payment due \
dates compliant with the applicable statement-delivery requirements?
"""
regulation = "Z"
gold_ids = ["1026.5(b)(2)(ii)(A)(1)", "1026.5(b)(2)(ii)(A)(2)"]
reference_answer = """
No, the payment due dates are not compliant. Under Regulation Z (12 CFR § 1026.5(b)(2)(ii)(A)(1)), a card issuer must adopt reasonable procedures designed to ensure that periodic statements are mailed or delivered at least 21 days prior to the payment due date. Because statements mailed on 29 October 2026 with a due date of 10 November 2026 provided only 12 days' notice, the card issuer failed to meet the 21-day requirement and cannot treat payments received within 21 days of mailing (by 19 November 2026) as late for any purpose.
"""
key_facts = [
  "credit card statements must be mailed or delivered at least 21 days prior to the payment due date",
  "a 10 November due date for statements mailed on 29 October provides only 12 days notice and is non-compliant",
  "payments received within 21 days of mailing (by 19 November 2026) cannot be treated as late for any purpose"
]
should_abstain = false

